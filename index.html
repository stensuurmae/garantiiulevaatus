<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17365d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Garantiiülevaatus">
<link rel="manifest" href="manifest.json">
<title>Garantiiülevaatus</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#eef1f5;color:#17202a}
button,input,textarea{font:inherit}button{border:1px solid #cbd3dd;border-radius:10px;background:#fff;padding:11px 14px}
.primary{background:#17365d;color:#fff;border-color:#17365d}.danger{background:#a40000;color:#fff}.wide{width:100%}
.top{background:#17365d;color:#fff;padding:16px; padding-top:max(16px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center}
.title{font-size:18px;font-weight:800}.sub{font-size:12px;opacity:.82;margin-top:3px}
.wrap{max-width:850px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #d5dce5;border-radius:14px;padding:14px;margin:10px 0}
label{display:block;font-size:12px;font-weight:700;margin:11px 0 5px}input,textarea{width:100%;padding:11px;border:1px solid #cbd3dd;border-radius:9px;background:#fff}textarea{min-height:110px}
.row{display:flex;gap:8px}.row>*{flex:1}.small{font-size:12px;color:#697586}.project{font-size:17px;font-weight:800}.meta{font-size:12px;color:#697586;margin-top:5px}
.item{border:1px solid #d5dce5;border-radius:11px;padding:12px;margin:8px 0;background:#fff}.num{font-weight:800}.badge{font-size:11px;background:#edf2f7;border-radius:20px;padding:4px 8px;display:inline-block;margin-top:7px}
.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:10px}.photo{border:1px solid #d5dce5;border-radius:10px;padding:7px;background:#fafafa}.photo img{width:100%;display:block;border-radius:7px}.photo button{width:100%;margin-top:7px}
.hidden{display:none!important}.sticky{position:sticky;bottom:10px;margin-top:12px;z-index:5}
#annotator{position:fixed;inset:0;background:#111;z-index:100;display:none;flex-direction:column}
#annotator .bar{color:#fff;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));display:flex;justify-content:space-between}
#canvasWrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
#canvas{max-width:100%;max-height:100%;touch-action:none}
#controls{background:#fff;padding:10px;display:flex;gap:8px;flex-wrap:wrap;padding-bottom:max(10px,env(safe-area-inset-bottom))}
@media(max-width:600px){.photos{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<section id="home">
<div class="top"><div><div class="title">GARANTIIÜLEVAATUS</div><div class="sub">Objektid</div></div></div>
<div class="wrap">
<div class="card">
<label>Projekti / objekti nimi</label>
<input id="projectInput" placeholder="nt Uusmäe 10">
<button id="newProjectBtn" class="primary wide" style="margin-top:9px">＋ UUS PROJEKT</button>
</div>
<input id="projectSearch" placeholder="Otsi projekti">
<div id="projectsList"></div>
</div>
</section>

<section id="inspection" class="hidden">
<div class="top">
<div><div class="title" id="currentProject"></div><div class="sub" id="stats"></div></div>
<button id="backBtn">Objektid</button>
</div>
<div class="wrap">
<div class="card">
<label>Ala</label><input id="area" placeholder="nt 4.1 Välisalad">
<label>Asukoht</label><input id="place" placeholder="nt peaukse ees">
<label>Probleemi kirjeldus</label><textarea id="description" placeholder="Kirjelda puudust..."></textarea>
<div class="row" style="margin-top:8px">
<button id="dictateBtn">🎙️ Dikteeri</button>
<label style="margin:0"><button type="button" id="photoBtn" class="wide">📷 Pildista / lisa fotod</button><input id="photoInput" type="file" accept="image/*" capture="environment" multiple hidden></label>
</div>
<div id="preview" class="photos"></div>
<button id="saveBtn" class="primary wide sticky">SALVESTA PUUDUS</button>
</div>
<div class="card"><b>Salvestatud puudused</b><div id="defectsList"></div></div>
<div class="card"><div class="row"><button id="wordBtn" class="primary">EKSPORDI WORDI</button><button id="backupBtn">VARUKOOPIA</button></div></div>
</div>
</section>

<div id="annotator">
<div class="bar"><b>Märgi foto</b><button id="closeAnn">✕</button></div>
<div id="canvasWrap"><canvas id="canvas"></canvas></div>
<div id="controls"><span class="small" style="flex:1">Joonista sõrmega punane ring, nool või muu märge.</span><button id="undoBtn">Võta tagasi</button><button id="clearBtn">Puhasta</button><button id="saveAnnBtn" class="primary">Salvesta</button></div>
</div>

<script>
(function(){
"use strict";
var DB_NAME="garantii_ulevaatus_clean_v1",STORE="defects";
var db=null,currentProject="",defects=[],pendingPhotos=[];
var annIndex=-1,annImage=null,annHistory=[],drawing=false;

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]})}
function openDB(){
 return new Promise(function(resolve,reject){
  var r=indexedDB.open(DB_NAME,1);
  r.onupgradeneeded=function(){if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE,{keyPath:"id"})};
  r.onsuccess=function(){db=r.result;resolve()};
  r.onerror=function(){reject(r.error||new Error("Andmebaasi avamine ebaõnnestus"))};
 });
}
function getAll(){
 return new Promise(function(resolve,reject){
  var r=db.transaction(STORE,"readonly").objectStore(STORE).getAll();
  r.onsuccess=function(){resolve(r.result||[])};r.onerror=function(){reject(r.error)};
 });
}
function put(x){
 return new Promise(function(resolve,reject){
  var r=db.transaction(STORE,"readwrite").objectStore(STORE).put(x);
  r.onsuccess=function(){resolve()};r.onerror=function(){reject(r.error)};
 });
}
function del(x){
 return new Promise(function(resolve,reject){
  var r=db.transaction(STORE,"readwrite").objectStore(STORE).delete(x);
  r.onsuccess=function(){resolve()};r.onerror=function(){reject(r.error)};
 });
}
function showHome(){ $("home").classList.remove("hidden");$("inspection").classList.add("hidden");renderProjects() }
function openProject(name){currentProject=name;$("currentProject").textContent=name;$("home").classList.add("hidden");$("inspection").classList.remove("hidden");renderDefects()}
function renderProjects(){
 var q=$("projectSearch").value.toLowerCase().trim();
 var names=[];defects.forEach(function(x){if(x.project&&names.indexOf(x.project)<0)names.push(x.project)});
 names=names.filter(function(n){return !q||n.toLowerCase().indexOf(q)>=0});
 var out="";
 names.forEach(function(n){
  var a=defects.filter(function(x){return x.project===n}),photos=a.reduce(function(s,x){return s+(x.photos||[]).length},0);
  out+='<div class="card"><div class="project">'+esc(n)+'</div><div class="meta">'+a.length+" puudust • "+photos+' fotot</div><div class="row" style="margin-top:9px"><button class="primary openP" data-name="'+esc(n)+'">Jätka</button><button class="delP" data-name="'+esc(n)+'">Kustuta</button></div></div>';
 });
 $("projectsList").innerHTML=out||'<div class="small" style="padding:18px;text-align:center">Projekte pole veel.</div>';
 Array.prototype.forEach.call(document.querySelectorAll(".openP"),function(b){b.onclick=function(){openProject(b.getAttribute("data-name"))}});
 Array.prototype.forEach.call(document.querySelectorAll(".delP"),function(b){b.onclick=function(){deleteProject(b.getAttribute("data-name"))}});
}
function newProject(){
 var n=$("projectInput").value.trim();
 if(!n){alert("Sisesta projekti / objekti nimi.");$("projectInput").focus();return}
 $("projectInput").value="";openProject(n)
}
async function deleteProject(n){
 if(!confirm("Kustutada projekt ja kõik selle puudused?"))return;
 var a=defects.filter(function(x){return x.project===n});
 for(var i=0;i<a.length;i++)await del(a[i].id);
 defects=defects.filter(function(x){return x.project!==n});renderProjects()
}
function renderDefects(){
 var a=defects.filter(function(x){return x.project===currentProject});
 var pc=a.reduce(function(s,x){return s+(x.photos||[]).length},0);
 $("stats").textContent=a.length+" puudust • "+pc+" fotot";
 var out="";
 a.forEach(function(x){out+='<div class="item"><div class="num">'+esc(x.number)+" "+esc(x.location||"")+'</div><div>'+esc(x.description)+'</div><span class="badge">'+(x.photos||[]).length+" fotot</span></div>"});
 $("defectsList").innerHTML=out||'<div class="small" style="margin-top:8px">Veel pole puuduseid.</div>';
}
function nextNumber(area){
 var max=0;
 defects.forEach(function(x){if(x.project===currentProject&&x.area===area){var n=parseInt(String(x.number).split(".").pop(),10);if(n>max)max=n}});
 return area+"."+(max+1)
}
function compress(file){
 return new Promise(function(resolve,reject){
  var r=new FileReader();
  r.onload=function(){
   var img=new Image();
   img.onload=function(){
    var scale=Math.min(1,1800/Math.max(img.naturalWidth,img.naturalHeight));
    var c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL("image/jpeg",0.78))
   };img.onerror=reject;img.src=r.result
  };r.onerror=reject;r.readAsDataURL(file)
 })
}
async function loadPhotos(){
 pendingPhotos=[];$("preview").innerHTML="";
 var files=Array.prototype.slice.call($("photoInput").files);
 for(var i=0;i<files.length;i++){var p=await compress(files[i]);pendingPhotos.push(p);addPreview(p,i)}
}
function addPreview(p,i){
 var d=document.createElement("div");d.className="photo";d.setAttribute("data-index",i);
 var img=document.createElement("img");img.src=p;var b=document.createElement("button");b.textContent="Märgi foto";b.onclick=function(){annotate(i)};
 d.appendChild(img);d.appendChild(b);$("preview").appendChild(d)
}
async function saveDefect(){
 var area=$("area").value.trim(),desc=$("description").value.trim();
 if(!area||!desc){alert("Sisesta ala ja probleemi kirjeldus.");return}
 var x={id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()),project:currentProject,area:area,number:nextNumber(area),location:$("place").value.trim(),description:desc,photos:pendingPhotos.slice(),created:new Date().toISOString()};
 await put(x);defects.push(x);$("area").value="";$("place").value="";$("description").value="";$("photoInput").value="";pendingPhotos=[];$("preview").innerHTML="";renderDefects()
}
function annotate(i){
 annIndex=i;annHistory=[];var img=new Image();
 img.onload=function(){annImage=img;var c=$("canvas");c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext("2d").drawImage(img,0,0);$("annotator").style.display="flex"};
 img.src=pendingPhotos[i]
}
function point(e){var c=$("canvas"),r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}
function saveState(){annHistory.push($("canvas").toDataURL("image/jpeg",0.78));if(annHistory.length>20)annHistory.shift()}
function down(e){e.preventDefault();drawing=true;saveState();var p=point(e),ctx=$("canvas").getContext("2d");ctx.beginPath();ctx.moveTo(p.x,p.y)}
function move(e){if(!drawing)return;e.preventDefault();var c=$("canvas"),p=point(e),ctx=c.getContext("2d"),scale=c.width/Math.max(1,c.getBoundingClientRect().width);ctx.strokeStyle="#e00000";ctx.lineWidth=Math.max(5,5*scale);ctx.lineCap="round";ctx.lineJoin="round";ctx.lineTo(p.x,p.y);ctx.stroke()}
function up(){drawing=false}
function undo(){var data=annHistory.pop(),c=$("canvas"),ctx=c.getContext("2d");if(!data){ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(annImage,0,0);return}var i=new Image();i.onload=function(){ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(i,0,0)};i.src=data}
function clearAnn(){saveState();var c=$("canvas"),ctx=c.getContext("2d");ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(annImage,0,0)}
function saveAnn(){pendingPhotos[annIndex]=$("canvas").toDataURL("image/jpeg",0.78);var card=document.querySelector('.photo[data-index="'+annIndex+'"]');if(card)card.querySelector("img").src=pendingPhotos[annIndex];$("annotator").style.display="none";annIndex=-1}
function exportWord(){
 if(!defects.filter(function(x){return x.project===currentProject}).length){alert("Pole midagi eksportida.");return}
 var a=defects.filter(function(x){return x.project===currentProject}),body="<h1>"+esc(currentProject)+"</h1><h2>Paikvaatlusel tuvastatud defektid</h2>",sec="";
 a.forEach(function(x){
  if(x.area!==sec){sec=x.area;body+='<h2 style="page-break-before:always">'+esc(sec)+"</h2>"}
  body+="<p><b>"+esc(x.number)+" "+esc(x.location||"")+"</b></p><p>"+esc(x.description).replace(/\\n/g,"<br>")+"</p>";
  (x.photos||[]).forEach(function(p,i){body+='<p style="text-align:center"><img src="'+p+'" style="max-width:680px;max-height:520px"><br>'+esc(x.number+"-"+(i+1))+"</p>"})
 });
 var htmlDoc="<!doctype html><html><head><meta charset='utf-8'></head><body style='font-family:Arial'>"+body+"</body></html>";
 var blob=new Blob([htmlDoc],{type:"application/msword"}),url=URL.createObjectURL(blob),aEl=document.createElement("a");aEl.href=url;aEl.download=currentProject.replace(/[^a-z0-9äöõüšž -]/gi,"_")+".doc";document.body.appendChild(aEl);aEl.click();setTimeout(function(){URL.revokeObjectURL(url);aEl.remove()},1500)
}
function backup(){var a=defects.filter(function(x){return x.project===currentProject});var blob=new Blob([JSON.stringify({project:currentProject,defects:a},null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),el=document.createElement("a");el.href=url;el.download="garantii_"+currentProject+".json";document.body.appendChild(el);el.click();setTimeout(function(){URL.revokeObjectURL(url);el.remove()},1500)}
$("newProjectBtn").onclick=newProject;$("projectSearch").oninput=renderProjects;$("backBtn").onclick=showHome;$("photoBtn").onclick=function(){$("photoInput").click()};$("photoInput").onchange=loadPhotos;$("saveBtn").onclick=saveDefect;$("wordBtn").onclick=exportWord;$("backupBtn").onclick=backup;
$("dictateBtn").onclick=function(){var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert("Selles brauseris pole dikteerimist saadaval. Kasuta telefoni klaviatuuri mikrofoni.");return}var r=new SR();r.lang="et-EE";r.interimResults=false;r.onresult=function(e){$("description").value+=($("description").value?" ":"")+e.results[0][0].transcript};r.start()};
$("closeAnn").onclick=function(){$("annotator").style.display="none"};$("undoBtn").onclick=undo;$("clearBtn").onclick=clearAnn;$("saveAnnBtn").onclick=saveAnn;
$("canvas").addEventListener("pointerdown",down);$("canvas").addEventListener("pointermove",move);$("canvas").addEventListener("pointerup",up);$("canvas").addEventListener("pointercancel",up);
openDB().then(function(){return getAll()}).then(function(a){defects=a;renderProjects()}).catch(function(e){console.error(e);alert("Rakenduse andmete avamine ebaõnnestus: "+e.message)});
})();
</script>
</body>
</html>
